name: NAM OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No repository writes, deployments, identity tokens or application secrets.
permissions:
  contents: read

concurrency:
  group: nam-os-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate production source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: production
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: production/package-lock.json

      - name: Record runtime versions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nam-os-ci"
          { node --version; npm --version; } | tee "$RUNNER_TEMP/nam-os-ci/runtime.log"

      - name: Install locked dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/nam-os-ci/install.log"

      - name: Check TypeScript
        timeout-minutes: 3
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/nam-os-ci/typecheck.log"

      - name: Run automated tests
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/nam-os-ci/tests.log"

      - name: Build the production application
        timeout-minutes: 6
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/nam-os-ci/build.log"

      - name: Retain bounded test and build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nam-os-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nam-os-ci/*.log
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
